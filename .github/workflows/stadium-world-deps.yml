name: Stadium World Dependencies

on:
  push:
    branches:
      - feature/stadium-world-spike
    paths:
      - '.github/workflows/stadium-world-deps.yml'
      - 'apps/web/package.json'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stadium-world-spike
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned 3D runtime
        run: npm install three@0.186.1 @react-three/fiber@9.8.1 --workspace @fantasy-all-sports/web --save-exact && npm install @types/three@0.186.0 --workspace @fantasy-all-sports/web --save-dev --save-exact
      - name: Commit lockfile update
        run: |
          if git diff --quiet -- apps/web/package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json package-lock.json
          git commit -m "Install Stadium World Three.js runtime"
          git push origin HEAD:feature/stadium-world-spike
