name: Recap Renderer CI

on:
  push:
    paths:
      - 'services/recap-renderer/**'
      - '.github/workflows/recap-renderer.yml'

concurrency:
  group: recap-renderer-${{ github.ref }}
  cancel-in-progress: true
  pull_request:
    paths:
      - 'services/recap-renderer/**'
      - '.github/workflows/recap-renderer.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: services/recap-renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/recap-renderer/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Docker build
        working-directory: services/recap-renderer
        run: docker build -t big-exec-recap-renderer:ci .
      - name: Sign in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish renderer image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: services/recap-renderer
        run: |
          docker tag big-exec-recap-renderer:ci ghcr.io/jbreezyasf/big-exec-recap-renderer:${{ github.sha }}
          docker tag big-exec-recap-renderer:ci ghcr.io/jbreezyasf/big-exec-recap-renderer:latest
          docker push ghcr.io/jbreezyasf/big-exec-recap-renderer:${{ github.sha }}
          docker push ghcr.io/jbreezyasf/big-exec-recap-renderer:latest
