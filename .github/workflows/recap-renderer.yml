name: Recap Renderer CI

on:
  push:
    paths:
      - 'services/recap-renderer/**'
      - '.github/workflows/recap-renderer.yml'
  pull_request:
    paths:
      - 'services/recap-renderer/**'
      - '.github/workflows/recap-renderer.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/recap-renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/recap-renderer/package.json
      - run: npm install
      - run: npm run build
      - name: Docker build
        working-directory: services/recap-renderer
        run: docker build -t big-exec-recap-renderer:ci .
